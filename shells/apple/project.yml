# The Apple shell's Xcode project, for XcodeGen. `just apple project` writes MailMind.xcodeproj from it.
name: MailMind
# The Mac app's icon, packaging and updates, which only the Mac target has.
include:
  - Release/mac.yml
options:
  bundleIdPrefix: io.github.lanterno
  # The lowest OS each app runs on, which the core is built for too (the justfile's xcframework, Release/release.sh).
  # The Mac app asks for nothing newer than macOS 15 has, so Macs a year behind run it, Intel ones among them.
  deploymentTarget:
    iOS: "26.0"
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    # The app's version, in this one place. The build number is the same, so it rises with every release, as Sparkle's
    # check for a newer version compares it.
    MARKETING_VERSION: "0.3.2"
    CURRENT_PROJECT_VERSION: "$(MARKETING_VERSION)"
    GENERATE_INFOPLIST_FILE: YES
    # The core is built for arm64 here: Apple silicon Macs, the iOS simulator on them, and devices. `just apple release`
    # builds the Mac app for Intel Macs too.
    ARCHS: arm64
    INFOPLIST_KEY_CFBundleDisplayName: MailMind
    DEAD_CODE_STRIPPING: YES
  configs:
    # The executable is stripped in Release, as an archive for the App Store is, so its measured size is the shipped one.
    Release:
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_STYLE: all

# Both apps build the same sources and link the same core.
targetTemplates:
  App:
    type: application
    sources:
      # MailMind Dev's driver is the Mac target's alone, and its Debug build's (below).
      - path: Sources
        excludes: ["Dev/**"]
      - Generated/MailMindCore.swift
      # Meadow's typefaces, which the app registers as it starts (Fonts/fonts.py makes them from the page's).
      - path: Fonts
        includes: ["*.ttf"]
        buildPhase: resources
    dependencies:
      - framework: build/MailMindCore.xcframework
        embed: false
      # SQLCipher in the core draws its random bytes from Security.
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_NAME: MailMind
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lanterno.mailmind

targets:
  MailMind-iOS:
    templates: [App]
    platform: iOS
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    scheme: {}

  MailMind-macOS:
    templates: [App]
    platform: macOS
    sources:
      # MailMind Dev's driver (docs/test-architecture.md section 5.2) and MailMindTestKit, which it presses keys and
      # finds things with. Release leaves both out (EXCLUDED_SOURCE_FILE_NAMES below), and every file of the driver is
      # inside `#if DEBUG` besides.
      - Sources/Dev
      - TestKit
    settings:
      base:
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        # The Swift module stays MailMind whatever the app is called, so the hosted tests import it in either build.
        PRODUCT_MODULE_NAME: MailMind
      configs:
        # The driver (Sources/Dev) and the test kit it stands on (TestKit) are compiled into MailMind Dev only: the
        # shipped app holds neither, which `just apple release-check` checks (docs/test-architecture.md section 6).
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: '*/Sources/Dev/* */TestKit/*'
        # The Debug build is MailMind Dev, an app of its own to macOS: its own preferences, saved state, login item,
        # notification permission and mailto: registration, so a build that is run or tested never stands in for the
        # person's MailMind (docs/test-architecture.md section 6). Release keeps the identity a person installs.
        Debug:
          PRODUCT_NAME: MailMindDev
          PRODUCT_BUNDLE_IDENTIFIER: io.github.lanterno.mailmind.dev
          INFOPLIST_KEY_CFBundleDisplayName: MailMind Dev
    scheme:
      testTargets: [MailMindTests]

  # The list model's tests. They compile the model with the bindings and link the core, so no app is launched.
  MailMindTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      # MailMindTestKit: keys, the mouse, the keyboard's place and the menu bar's items, as a person meets them. The
      # in-app driver (Sources/Dev) reuses it, so it holds no XCTest.
      - TestKit
      # When the driver may start, which DriverSafetyTests hold
      - Sources/Dev/Driver/DriverSafety.swift
      - Sources/ListModel.swift
      - Generated/MailMindCore.swift
      # The seams the app reaches the system through, which the tests put their own into
      - Sources/Seams
      # The client over the core in this process, and the window's list over it
      - Sources/Client
      - Sources/Window/MailList.swift
      # The acknowledgements a release carries
      - Sources/Acknowledgements.swift
      # The window's state the areas hang on
      - Sources/Window/MailApp.swift
      - Sources/Window/Reader.swift
      # Every area's models and views: Settings and the status, the mailbox, the reader and its pane, the composer,
      # and what they share.
      - Sources/Mac
      # Meadow's typefaces, which the tests register as the app does
      - path: Fonts
        includes: ["*.ttf"]
        buildPhase: resources
    dependencies:
      - framework: build/MailMindCore.xcframework
        embed: false
      - sdk: Security.framework

  # The hosted tests: their host is the Mac app itself (Debug, MailMind Dev), so its real scenes, its `Commands` and the menu bar
  # AppKit builds from them exist, and the tests reach them through `NSApp`, the window key in an active app. They need
  # a real session and take the screen and the keyboard, so they run on CI's macOS runners only (lane B,
  # docs/test-strategy.md section 4.5), through `just apple test-hosted`, never on a person's Mac.
  MailMindAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AppTests
        excludes: ["*.py"]
    dependencies:
      - target: MailMind-macOS
        embed: false
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
      configs:
        # The app each configuration builds: MailMind Dev in Debug, which the scheme tests, MailMind in Release.
        Debug:
          TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MailMindDev.app/Contents/MacOS/MailMindDev"
        Release:
          TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MailMind.app/Contents/MacOS/MailMind"

# The hosted tests' own scheme, so `just apple test` (MailMind-macOS's, the unhosted MailMindTests) stays as it was.
schemes:
  MailMindAppTests:
    build:
      targets:
        MailMind-macOS: all
        MailMindAppTests: [test]
    test:
      config: Debug
      targets: [MailMindAppTests]
