[project]
name = "mailmind"
version = "0.1.0"
description = "A local-first mail client with AI triage, served on 127.0.0.1."
readme = "README.md"
requires-python = ">=3.14"
# What the new front door (`python -m mailmind serve`) runs on. The old one, `python3 server.py`,
# imports none of these, so it still runs with nothing installed: it is the kill switch.
dependencies = [
    "anthropic>=2.4.0",
    "fastapi>=0.162.0",
    "imapclient>=4.1.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
# Flat modules, not an installable package: uv manages the dev environment and the lock only.
package = false

[dependency-groups]
dev = [
    "axe-playwright-python>=0.1.8",
    "hypothesis>=6.170.14",
    "import-linter>=2.15",
    "playwright>=1.64.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "time-machine>=3.6.0",
    "trustme>=1.2.1",
]

[tool.ruff.lint]
# Pyflakes' checks only (undefined names, unused imports and the like), the lint this repo
# has always run. Widening the rule set is a change of its own.
select = ["F"]

[tool.pytest]
testpaths = ["tests"]
# The app's flat modules, and the helpers beside the tests (guard, fakes, fixtures).
pythonpath = [".", "tests"]
# importlib mode: test modules are imported by path, so tests/ never shadows the root's tests.py.
addopts = ["--import-mode=importlib", "-ra"]
markers = [
    "browser: drives the page in Chromium; skipped unless pytest runs with --browser",
    "dovecot: runs against Dovecot in Docker; skipped unless pytest runs with --dovecot",
]

[tool.importlinter]
# The package's own layers. Which legacy modules it imports is the ratchet's job
# (tests/test_ratchet.py), since those modules sit outside the package. External packages are
# in the graph too, so a contract can say who may import one.
root_packages = ["mailmind"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "bootstrap, then http, then the contexts, then platform, then kernel: each imports only the layers below it"
type = "layers"
layers = ["mailmind.bootstrap", "mailmind.http", "mailmind.assistant | mailmind.accounts | mailmind.mailbox | mailmind.discovery | mailmind.curation", "mailmind.platform", "mailmind.content", "mailmind.kernel"]

[[tool.importlinter.contracts]]
name = "within the Assistant, adapters, then application, then domain"
type = "layers"
layers = ["mailmind.assistant.adapters", "mailmind.assistant.application", "mailmind.assistant.domain"]

[[tool.importlinter.contracts]]
name = "within Accounts, adapters, then application, then domain"
type = "layers"
# Parenthesized: a layer the context doesn't have yet.
layers = ["mailmind.accounts.adapters", "(mailmind.accounts.application)", "(mailmind.accounts.domain)"]

[[tool.importlinter.contracts]]
name = "within the Mailbox, adapters, then application, then domain"
type = "layers"
layers = ["mailmind.mailbox.adapters", "(mailmind.mailbox.application)", "(mailmind.mailbox.domain)"]

[[tool.importlinter.contracts]]
name = "within Discovery, adapters, then application, then domain"
type = "layers"
layers = ["mailmind.discovery.adapters", "mailmind.discovery.application", "mailmind.discovery.domain"]

[[tool.importlinter.contracts]]
name = "within Curation, adapters, then application, then domain"
type = "layers"
layers = ["mailmind.curation.adapters", "mailmind.curation.application", "mailmind.curation.domain"]

[[tool.importlinter.contracts]]
name = "only bootstrap picks an adapter"
type = "forbidden"
source_modules = ["mailmind.http", "mailmind.platform", "mailmind.kernel"]
forbidden_modules = ["mailmind.curation.adapters", "mailmind.assistant.adapters", "mailmind.accounts.adapters", "mailmind.mailbox.adapters", "mailmind.discovery.adapters"]

[[tool.importlinter.contracts]]
name = "only the SDK adapter reaches the Anthropic SDK"
type = "forbidden"
source_modules = ["mailmind.http", "mailmind.platform", "mailmind.kernel",
                  "mailmind.assistant.application", "mailmind.assistant.domain",
                  "mailmind.assistant.adapters.wire", "mailmind.assistant.adapters.urllib_http",
                  "mailmind.assistant.adapters.disabled"]
forbidden_modules = ["anthropic"]

[[tool.importlinter.contracts]]
# bootstrap.assistant loads the SDK adapter when the new door asks for it, and only then.
name = "bootstrap imports the Anthropic SDK only through its adapter"
type = "forbidden"
source_modules = ["mailmind.bootstrap"]
forbidden_modules = ["anthropic"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "only the IMAPClient adapter reaches IMAPClient"
type = "forbidden"
source_modules = ["mailmind.http", "mailmind.platform", "mailmind.content", "mailmind.kernel", "mailmind.assistant",
                  "mailmind.accounts", "mailmind.curation", "mailmind.discovery", "mailmind.mailbox.application", "mailmind.mailbox.domain",
                  "mailmind.mailbox.adapters.imap_list", "mailmind.mailbox.adapters.imap_names",
                  "mailmind.mailbox.adapters.imaplib_session"]
forbidden_modules = ["imapclient"]

[[tool.importlinter.contracts]]
# bootstrap.mailbox loads the IMAPClient adapter when use("imapclient") asks for it, and only then.
name = "bootstrap imports IMAPClient only through its adapter"
type = "forbidden"
source_modules = ["mailmind.bootstrap"]
forbidden_modules = ["imapclient"]
allow_indirect_imports = true
