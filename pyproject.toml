[project]
name = "mailmind"
version = "0.1.0"
description = "A local-first mail client with AI triage, served on 127.0.0.1."
readme = "README.md"
requires-python = ">=3.14"
# What `python -m mailmind serve` runs on.
dependencies = [
    "anthropic>=2.4.0",
    "fastapi>=0.162.0",
    "icalendar>=7.3.0",
    "imapclient>=4.1.0",
    "recurring-ical-events>=3.8.2",
    "sqlcipher3>=0.6.4",
    "uvicorn>=0.54.0",
]

[tool.uv]
# Flat modules, not an installable package: uv manages the dev environment and the lock only.
package = false

[dependency-groups]
dev = [
    "axe-playwright-python>=0.1.8",
    "hypothesis>=6.170.14",
    "import-linter>=2.15",
    "pip-audit>=2.10.1",
    "playwright>=1.64.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.3",
    "time-machine>=3.6.0",
    "trustme>=1.2.1",
]

[tool.ruff.lint]
# Pyflakes' checks only (undefined names, unused imports and the like), the lint this repo
# has always run. Widening the rule set is a change of its own.
select = ["F"]

[tool.pytest]
testpaths = ["tests"]
# The app's flat modules, the fakes and fixtures beside the tests, and the helpers in tests/support (guard, gate, golden).
pythonpath = [".", "tests", "tests/support"]
# importlib mode: test modules are imported by path, so a folder like tests/unit/calendar never shadows a module.
addopts = ["--import-mode=importlib", "-ra"]
markers = [
    "browser: drives the page in Chromium; skipped unless pytest runs with --browser",
    "dovecot: runs against Dovecot in Docker; skipped unless pytest runs with --dovecot",
]

[tool.pyright]
include = ["mailmind"]
exclude = ["mailmind/platform/db/migrations", "**/__pycache__"]    # frozen, never edited
typeCheckingMode = "basic"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
# The proposal asks this of the kernel, content, every domain and every application package. A package joins
# when it reaches zero, and from then on stays there.
strict = [
    "mailmind/kernel",
    "mailmind/content",
    "mailmind/accounts/domain",
    "mailmind/assistant/domain",
    "mailmind/attention/domain",
    "mailmind/calendar/domain",
    "mailmind/compose/domain",
    "mailmind/curation/domain",
    "mailmind/discovery/domain",
    "mailmind/mailbox/domain",
    "mailmind/accounts/application",
    "mailmind/assistant/application",
    "mailmind/attention/application",
    "mailmind/calendar/application",
    "mailmind/compose/application",
    "mailmind/curation/application",
    "mailmind/discovery/application",
    "mailmind/mailbox/application",
]

[tool.importlinter]
# The package's own layers. External packages are in the graph too, so a contract can say who may
# import one.
root_packages = ["mailmind"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "bootstrap, then http, then the contexts, then platform, then kernel: each imports only the layers below it"
type = "layers"
layers = ["mailmind.bootstrap", "mailmind.http", "mailmind.assistant | mailmind.accounts | mailmind.mailbox | mailmind.discovery | mailmind.curation | mailmind.calendar | mailmind.attention | mailmind.compose", "mailmind.platform", "mailmind.content", "mailmind.kernel"]

[[tool.importlinter.contracts]]
name = "within the Assistant, adapters, then application, then domain"
type = "layers"
layers = ["mailmind.assistant.adapters", "mailmind.assistant.application", "mailmind.assistant.domain"]

[[tool.importlinter.contracts]]
name = "within Accounts, adapters, then application, then domain"
type = "layers"
# Parenthesized: a layer the context doesn't have yet.
layers = ["mailmind.accounts.adapters", "(mailmind.accounts.application)", "(mailmind.accounts.domain)"]

[[tool.importlinter.contracts]]
name = "within the Mailbox, adapters, then application, then domain"
type = "layers"
layers = ["mailmind.mailbox.adapters", "(mailmind.mailbox.application)", "(mailmind.mailbox.domain)"]

[[tool.importlinter.contracts]]
name = "within Discovery, adapters, then application, then domain"
type = "layers"
layers = ["mailmind.discovery.adapters", "mailmind.discovery.application", "mailmind.discovery.domain"]

[[tool.importlinter.contracts]]
name = "within Curation, adapters, then application, then domain"
type = "layers"
layers = ["mailmind.curation.adapters", "mailmind.curation.application", "mailmind.curation.domain"]

[[tool.importlinter.contracts]]
name = "within Calendar, adapters, then application, then domain"
type = "layers"
layers = ["mailmind.calendar.adapters", "mailmind.calendar.application", "mailmind.calendar.domain"]

[[tool.importlinter.contracts]]
name = "within Attention, adapters, then application, then domain"
type = "layers"
layers = ["mailmind.attention.adapters", "mailmind.attention.application", "mailmind.attention.domain"]

[[tool.importlinter.contracts]]
name = "within Compose, adapters, then application, then domain"
type = "layers"
layers = ["mailmind.compose.adapters", "mailmind.compose.application", "mailmind.compose.domain"]

[[tool.importlinter.contracts]]
# bootstrap binds the use cases and hands them to the routers, so a route never names one.
name = "http reaches a context only through its api"
type = "forbidden"
source_modules = ["mailmind.http"]
forbidden_modules = ["mailmind.accounts.domain",
                   "mailmind.accounts.application",
                   "mailmind.assistant.domain",
                   "mailmind.assistant.application",
                   "mailmind.attention.domain",
                   "mailmind.attention.application",
                   "mailmind.calendar.domain",
                   "mailmind.calendar.application",
                   "mailmind.compose.domain",
                   "mailmind.compose.application",
                   "mailmind.curation.domain",
                   "mailmind.curation.application",
                   "mailmind.discovery.domain",
                   "mailmind.discovery.application",
                   "mailmind.mailbox.domain",
                   "mailmind.mailbox.application",
                   "mailmind.content"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
# tests/test_architecture.py says the same of the standard library's I/O, which the graph doesn't hold.
name = "a domain imports only the standard library, the kernel and content"
type = "forbidden"
source_modules = ["mailmind.accounts.domain",
                 "mailmind.assistant.domain",
                 "mailmind.attention.domain",
                 "mailmind.calendar.domain",
                 "mailmind.compose.domain",
                 "mailmind.curation.domain",
                 "mailmind.discovery.domain",
                 "mailmind.mailbox.domain"]
forbidden_modules = ["mailmind.platform", "fastapi", "pydantic", "anthropic", "imapclient", "uvicorn", "anyio"]

[[tool.importlinter.contracts]]
name = "only bootstrap picks an adapter"
type = "forbidden"
source_modules = ["mailmind.http", "mailmind.platform", "mailmind.kernel"]
forbidden_modules = ["mailmind.attention.adapters", "mailmind.calendar.adapters", "mailmind.compose.adapters", "mailmind.curation.adapters", "mailmind.assistant.adapters", "mailmind.accounts.adapters", "mailmind.mailbox.adapters", "mailmind.discovery.adapters"]

[[tool.importlinter.contracts]]
name = "only the SDK adapter reaches the Anthropic SDK"
type = "forbidden"
source_modules = ["mailmind.http", "mailmind.platform", "mailmind.kernel",
                  "mailmind.assistant.application", "mailmind.assistant.domain",
                  "mailmind.assistant.adapters.wire", "mailmind.assistant.adapters.disabled"]
forbidden_modules = ["anthropic"]

[[tool.importlinter.contracts]]
# bootstrap.assistant binds the SDK's adapter, for the server and every command alike.
name = "bootstrap imports the Anthropic SDK only through its adapter"
type = "forbidden"
source_modules = ["mailmind.bootstrap"]
forbidden_modules = ["anthropic"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "only the IMAPClient adapter reaches IMAPClient"
type = "forbidden"
source_modules = ["mailmind.http", "mailmind.platform", "mailmind.content", "mailmind.kernel", "mailmind.assistant",
                  "mailmind.accounts", "mailmind.attention", "mailmind.calendar", "mailmind.compose", "mailmind.curation", "mailmind.discovery", "mailmind.mailbox.application", "mailmind.mailbox.domain",
                  "mailmind.mailbox.adapters.imap.imap_list", "mailmind.mailbox.adapters.imap.imap_names",
                  "mailmind.mailbox.adapters.imap.imaplib_session"]
forbidden_modules = ["imapclient"]

[[tool.importlinter.contracts]]
# bootstrap.mailbox loads the IMAPClient adapter when use("imapclient") asks for it, and only then.
name = "bootstrap imports IMAPClient only through its adapter"
type = "forbidden"
source_modules = ["mailmind.bootstrap"]
forbidden_modules = ["imapclient"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "only the reader of invites reaches icalendar and recurring-ical-events"
type = "forbidden"
source_modules = ["mailmind.http", "mailmind.platform", "mailmind.content", "mailmind.kernel", "mailmind.assistant",
                  "mailmind.accounts", "mailmind.attention", "mailmind.compose", "mailmind.curation", "mailmind.discovery", "mailmind.mailbox",
                  "mailmind.calendar.application", "mailmind.calendar.domain",
                  "mailmind.calendar.adapters.sqlite"]
forbidden_modules = ["icalendar", "recurring_ical_events"]

[[tool.importlinter.contracts]]
# bootstrap.calendar binds that reader as it loads. The command line never loads it: test_cli.py runs it with nothing installed.
name = "bootstrap imports icalendar and recurring-ical-events only through that reader"
type = "forbidden"
source_modules = ["mailmind.bootstrap"]
forbidden_modules = ["icalendar", "recurring_ical_events"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
# The database is encrypted: every connection is opened and keyed by platform.db.database, through the driver.
name = "only the database driver reaches SQLCipher"
type = "forbidden"
source_modules = ["mailmind"]
forbidden_modules = ["sqlcipher3"]
ignore_imports = ["mailmind.platform.db.driver -> sqlcipher3"]
allow_indirect_imports = true
