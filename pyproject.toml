[project]
name = "mailmind"
version = "0.1.0"
description = "A local-first mail client with AI triage, served on 127.0.0.1."
readme = "README.md"
requires-python = ">=3.14"
# What the new front door (`python -m mailmind serve`) runs on. The old one, `python3 server.py`,
# imports none of these, so it still runs with nothing installed: it is the kill switch.
dependencies = [
    "anthropic>=2.4.0",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
# Flat modules, not an installable package: uv manages the dev environment and the lock only.
package = false

[dependency-groups]
dev = [
    "axe-playwright-python>=0.1.8",
    "import-linter>=2.15",
    "playwright>=1.64.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "time-machine>=3.6.0",
    "trustme>=1.2.1",
]

[tool.ruff.lint]
# Pyflakes' checks only (undefined names, unused imports and the like), the lint this repo
# has always run. Widening the rule set is a change of its own.
select = ["F"]

[tool.pytest]
testpaths = ["tests"]
# The app's flat modules, and the helpers beside the tests (guard, fakes, fixtures).
pythonpath = [".", "tests"]
# importlib mode: test modules are imported by path, so tests/ never shadows the root's tests.py.
addopts = ["--import-mode=importlib", "-ra"]
markers = ["browser: drives dashboard.html in Chromium; skipped unless pytest runs with --browser"]

[tool.importlinter]
# The package's own layers. Which legacy modules it imports is the ratchet's job
# (tests/test_ratchet.py), since those modules sit outside the package.
root_packages = ["mailmind"]

[[tool.importlinter.contracts]]
name = "bootstrap, then http, then platform, then kernel: each imports only the layers below it"
type = "layers"
layers = ["mailmind.bootstrap", "mailmind.http", "mailmind.platform", "mailmind.kernel"]
