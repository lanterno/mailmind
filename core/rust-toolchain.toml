# One compiler for every machine and every CI runner. Change it in a commit of its own.
[toolchain]
channel = "1.99.1"
profile = "minimal"
components = ["clippy", "rustfmt"]
# x86_64-apple-darwin is for Intel Macs: `just apple release` builds the Mac app universal.
targets = ["wasm32-unknown-unknown", "aarch64-apple-ios", "aarch64-apple-ios-sim", "x86_64-apple-darwin"]
