# The MailMind core: one Rust library that every client runs. See core/CLAUDE.md.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false

[workspace.dependencies]
mm-kernel = { path = "crates/mm-kernel" }
mm-store = { path = "crates/mm-store" }
mm-app = { path = "crates/mm-app" }
mm-content = { path = "crates/mm-content" }
mm-fixtures = { path = "crates/mm-fixtures" }
mm-curation = { path = "crates/mm-curation" }
mm-discovery = { path = "crates/mm-discovery" }
mm-attention = { path = "crates/mm-attention" }
mm-mailbox = { path = "crates/mm-mailbox" }
mm-net = { path = "crates/mm-net" }
mm-accounts = { path = "crates/mm-accounts" }
mm-imap = { path = "crates/mm-imap" }
mm-server = { path = "crates/mm-server" }
mm-assistant = { path = "crates/mm-assistant" }
mm-compose = { path = "crates/mm-compose" }

# SQLCipher everywhere: Apple's CommonCrypto on Apple systems, a vendored OpenSSL on the others (each crate that
# opens the database adds that feature for those targets), and LibTomCrypt in the browser, through sqlite-wasm-rs.

# The Rust server (mm-server): axum's router on hyper's HTTP/1.1, which the server's own accept loop drives so that an
# answer carries no Date or Server header, on tokio. None of axum's extractors: a query and a body are read as the
# Python app reads them.
axum = { version = "=0.8.9", default-features = false }
# The page's scripts and stylesheets, compressed for a browser that takes them, as the Python app does.
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
# A download as a stream of chunks (axum's Body::from_stream), for the Rust server's exports.
# The event stream's body, a stream of frames as they come (mm-server), as axum takes one.
futures-core = { version = "=0.3.34", default-features = false }
# The CSRF token, from the operating system's random source.
getrandom = "=0.4.3"
# The HTML tokenizer browsers' parsing follows, for the sanitizer (mm-content).
html5ever = "0.40.1"
# An IMAP server's answers, read into values (mm-imap): RFC 3501 with the extensions MailMind uses, Gmail's among them.
imap-proto = "=0.17.0"
hyper = { version = "=1.12.0", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio", "service"] }
# A message's MIME structure, with the legacy charsets mail still arrives in.
mail-parser = { version = "1.0.0", features = ["full_encoding"] }
# The Python app's bindings to the leaves the core shares with it (mm-py), until the Rust server replaces it.
pyo3 = { version = "0.30.1", features = ["abi3-py314"] }
pyo3-build-config = "0.30.1"
regex = "1.13.1"
rusqlite = { version = "0.42", features = ["bundled-sqlcipher"] }
# TLS to a mail server (mm-imap), on ring, whose licences fit where aws-lc's OpenSSL licence does not.
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# The roots the system trusts (mm-net), for verified TLS to a mail server off this machine: the Keychain's on Apple
# systems, a root a person added included, the system's store elsewhere. rustls checks the chain against them, as the
# Python app's OpenSSL does.
rustls-native-certs = "=0.8.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11.0"
sha2 = "0.11.1"
tempfile = "3"
tokio = { version = "=1.54.1", default-features = false, features = ["rt-multi-thread", "net", "sync", "time"] }
toml = "0.9"
tower-service = "=0.3.3"
ts-rs = "12"
uniffi = { version = "=0.32.2", features = ["cli"] }
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
print_stdout = "warn"
unwrap_used = "warn"

[profile.dev]
# Line tables are enough for a backtrace, and keep the build folder a fraction of the size.
debug = "line-tables-only"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
