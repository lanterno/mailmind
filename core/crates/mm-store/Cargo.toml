[package]
name = "mm-store"
description = "The encrypted database and the config file: the one place the core opens a file"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mm-accounts.workspace = true
mm-assistant.workspace = true
mm-compose.workspace = true
# A message's parts, as opening it keeps them.
mm-content.workspace = true
mm-discovery.workspace = true
mm-curation.workspace = true
mm-kernel.workspace = true
mm-mailbox.workspace = true
# A snapshot of the database, copied page for page (the online backup API).
rusqlite = { workspace = true, features = ["backup"] }
# Calendar's ports: the invites stored mail holds, what the outbox has sent and the zones a TZID names.
mm-calendar.workspace = true
# The ports of the contexts whose SQL is here: Discovery's, Curation's and Attention's.
mm-attention.workspace = true
# mailmind.config.json, written back with its keys in the order they came.
serde_json = { workspace = true, features = ["preserve_order"] }
zeroize.workspace = true

# SQLCipher needs a crypto library: Apple systems have CommonCrypto and the browser build has LibTomCrypt.
# Everywhere else it is OpenSSL, compiled in so that no system library is assumed.
[target.'cfg(not(any(target_vendor = "apple", target_arch = "wasm32")))'.dependencies]
rusqlite = { workspace = true, features = ["bundled-sqlcipher-vendored-openssl"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
