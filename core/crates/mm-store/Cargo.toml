[package]
name = "mm-store"
description = "The encrypted database: the one place the core opens a file"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mm-kernel.workspace = true
rusqlite.workspace = true
zeroize.workspace = true

# SQLCipher needs a crypto library: Apple systems have CommonCrypto and the browser build has LibTomCrypt.
# Everywhere else it is OpenSSL, compiled in so that no system library is assumed.
[target.'cfg(not(any(target_vendor = "apple", target_arch = "wasm32")))'.dependencies]
rusqlite = { workspace = true, features = ["bundled-sqlcipher-vendored-openssl"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
