[package]
name = "mm-ffi"
description = "The contract for Swift and Kotlin, through UniFFI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The library the Apple and Android shells link: a static one for Apple's frameworks, a shared one for Android
# and for generating the bindings.
name = "mailmind_core"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[features]
# The app in the shell's own process (mm-host), which the Apple app runs. Android's screens are still step 0's: its
# library and its bindings leave the host out (`--no-default-features`).
default = ["host"]
host = ["dep:mm-host"]

[dependencies]
mm-app.workspace = true
mm-host = { workspace = true, optional = true }
mm-fixtures.workspace = true
uniffi.workspace = true
zeroize.workspace = true

[lints]
workspace = true
