[package]
name = "mm-mailbox"
description = "The mail on each server: threading, the folders' roles, the folder rail"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# A message opened: its parts, its HTML made safe and the document its frame loads.
mm-content.workspace = true
mm-kernel.workspace = true
regex.workspace = true
# A row as a query gave it, and the answers built from rows, as the Python app's dicts.
serde_json = { workspace = true, features = ["preserve_order"] }
# A command's params and an undo entry, their keys in the order they were written, as Python's dicts keep theirs.
sha1.workspace = true

[lints]
workspace = true
