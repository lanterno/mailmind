[package]
name = "mm-server"
description = "The Rust server: the Python app's HTTP API and its page, on the core's use cases"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "mailmind-server"
path = "src/main.rs"

[dependencies]
axum.workspace = true
flate2.workspace = true
# A download read in chunks as it is sent, so a large export never sits in memory.
futures-core.workspace = true
getrandom.workspace = true
hyper.workspace = true
hyper-util.workspace = true
mm-accounts.workspace = true
mm-assistant.workspace = true
mm-compose.workspace = true
mm-curation.workspace = true
# A message's parts, which what opens it reads.
mm-content.workspace = true
mm-discovery.workspace = true
mm-imap.workspace = true
mm-kernel.workspace = true
mm-mailbox.workspace = true
mm-store.workspace = true
# Discovery's, Curation's and Attention's use cases.
mm-attention.workspace = true
# The outbox's sends, over each account's SMTP server.
mm-smtp.workspace = true
# An answer's JSON in the order its fields were written, as Python's dicts keep theirs.
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
tokio.workspace = true
tower-service.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
