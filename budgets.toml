# The limits every MailMind client is held to. A number here is a promise, and a build that breaks one fails.
#
# The architecture proposed these; step 0 measures each on the walking skeleton. A limit changes only in a commit
# that says why. `measured` is the last number recorded by hand and `on` says where; the check reads only `limit`.
#
# `just budgets` measures the [core] entries on the 100,000-message fictional fixture. Each shell measures its own.

[core.open_to_first_rows_ms]
what = "open the database, order an inbox of 100,000 messages and load its first rows"
limit = 150.0
measured = 10.7
on = "Apple silicon Mac, macOS 26.4, release build, 2026-11-13"
# Version 51's idx_msg_listed holds a folder in the order a list shows it, so the first page is the first rows read.
# Before it, SQLite sorted all 100,000 rows first: 121.8 ms on 2026-11-12.

[core.idle_memory_mb]
what = "the core's heap and SQLite's memory with that inbox open and idle"
limit = 40.0
measured = 3.5
on = "Apple silicon Mac, macOS 26.4, release build, 2026-11-12"

[core.scroll_page_p95_ms]
what = "load the next page of 50 rows while scrolling, 95th percentile"
limit = 3.0
measured = 0.05
on = "Apple silicon Mac, macOS 26.4, release build, 2026-11-12"

[core.jump_p95_ms]
what = "load the rows around a far position, as a scrollbar drag does, 95th percentile"
limit = 16.0
measured = 0.19
on = "Apple silicon Mac, macOS 26.4, release build, 2026-11-12"

# The shells. Each measures its own (`just apple measure`, `just web measure`, `just desktop measure`); no check reads
# these yet. Measured on an Apple M5 Mac shared with other builds, so numbers vary by 10 to 20% run to run.

[apple.mac_first_rows_ms]
what = "launch the Mac app, release build, to the first rows applied on the main actor (warm file cache, median of 7)"
limit = 800.0
measured = 217.8
on = "Apple M5 Mac, macOS 26.4, Xcode 26.6, 2026-11-13"

[apple.mac_idle_memory_mb]
what = "the Mac app's footprint, idle with the inbox open"
limit = 200.0
measured = 27.9
on = "Apple M5 Mac, macOS 26.4, Xcode 26.6, 2026-11-13"

[apple.mac_scrolled_memory_mb]
what = "the Mac app's footprint after scrolling all 100,000 rows and 12 far jumps"
limit = 200.0
measured = 41.4
on = "Apple M5 Mac, macOS 26.4, Xcode 26.6, 2026-11-13"
# The native table reuses a screen of cells. SwiftUI's List kept state for every row it had shown: 109 MB.

[apple.mac_frame_p95_ms]
what = "the main thread's busy time per run-loop pass while scrolling, 95th percentile"
limit = 8.0
measured = 5.85
on = "Apple M5 Mac, macOS 26.4, Xcode 26.6, 2026-11-13"
# The worst of three: 3.3 ms on a fast scroll, 5.85 ms bringing a new screen in every frame through all 100,000,
# 5.8 ms on far jumps. An NSTableView with one row height, its rows drawn with Core Text. Measured with the app held
# awake, as a person scrolling has it in front: behind a locked screen macOS naps it to about half speed (15.6 ms).
# SwiftUI's List, held awake the same way, took 9.2, 19.6 and 75.7 ms; the 296 ms first recorded was it napped.

[apple.core_size_mb]
what = "what the core adds to a stripped arm64 app (iOS device and macOS)"
limit = 8.0
measured = 1.61
on = "Apple M5 Mac, Xcode 26.6, release build, 2026-11-12"
# 3.7 MB with TLS and OpenPGP key parsing, 5.0 MB with an OpenPGP round trip.

[web.first_rows_ms]
what = "navigation to the first rows painted, the fixture already in the browser's private files (median of 7)"
limit = 800.0
measured = 99.0
on = "headless Chromium on an Apple M5 Mac, 2026-11-13"
# 1,021 ms before version 51's index (see core.open_to_first_rows_ms), nearly all of it sorting the inbox with every
# page decrypted without AES instructions.

[web.wasm_compressed_mb]
what = "the core as WebAssembly, Brotli"
limit = 2.5
measured = 0.51
on = "release build, no wasm-opt, 2026-11-13"

[desktop.mac_first_rows_ms]
what = "launch the release .app to the first rows in the DOM (median of 5)"
limit = 800.0
measured = 724.0
on = "Apple M5 Mac, macOS 26.4, screen locked, 2026-11-12"

[desktop.mac_idle_memory_mb]
what = "footprint of the app, its WebContent and Networking processes, idle with the inbox open"
limit = 200.0
measured = 83.9
on = "Apple M5 Mac, macOS 26.4, screen locked, 2026-11-12"
# 100.8 MB with the GPU process WebKit also starts.
